[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-clause-form"
version = "0.1.0"
description = "Python implementation of Fitting's dual clause form algorithm"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Richard Scheiwe" }]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
